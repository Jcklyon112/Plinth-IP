services:
  db:
    image: postgis/postgis:15-3.3
    container_name: plinth_db
    environment:
      POSTGRES_USER: plinth
      POSTGRES_PASSWORD: plinth_dev
      POSTGRES_DB: plinth_sip
    ports:
      - "5432:5432"
    volumes:
      - plinth_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plinth -d plinth_sip"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: plinth_backend
    environment:
      DATABASE_URL: postgresql://plinth:plinth_dev@db:5432/plinth_sip
      ENV: development
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./configs:/configs
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    container_name: plinth_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000

volumes:
  plinth_pgdata:
